<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IGCSE Pseudocode Compiler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!--
  Monaco injects this stylesheet itself, but only after the editor has already
  been created, so the editor is laid out unstyled and then jumps into place.
  Loading it up front avoids that jump. Keep the version in step with loader.js.
-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/monaco-editor@0.56.0/min/vs/editor/editor.main.css">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">
      <img src="{{ url_for('static', filename='favicon.png') }}">
    </span>
    <span class="brand-name">Pseudocode Interpreter</span>
  </div>

  <div class="status" id="status">
    <span class="status-dot" id="status-dot"></span>
    <span id="status-label">Loading editor…</span>
  </div>

  <button id="run-btn" class="run-btn" disabled>
    <span class="run-icon">&#9654;</span> Run
  </button>
</header>

<main class="workspace">

  <section class="pane editor-pane">
    <div class="pane-header">Source</div>
    <div class="editor-wrap">
      <div id="editor" class="monaco-host" aria-label="Pseudocode source editor"></div>
    </div>
  </section>

  <section class="pane console-pane">
    <div class="pane-header">Output</div>
    <div class="console" id="console"></div>
    <form id="input-row" class="input-row hidden" autocomplete="off">
      <span class="input-caret">&gt;</span>
      <input id="input-field" class="input-field" type="text" placeholder="Enter a value…" autofocus>
      <button type="submit" class="input-send">Send</button>
    </form>
  </section>

</main>

<!--
  Monaco is pinned to a known release. The current project has no frontend
  bundler, so the browser AMD loader is the smallest integration step. The
  language definition is kept in a separate adapter so the eventual VS Code
  extension can reuse the same language rules without depending on Flask.
-->
<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.56.0/min/vs/loader.js"></script>
<script src="{{ url_for('static', filename='pseudocode-monaco.js') }}"></script>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
